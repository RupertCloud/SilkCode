[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silkcode"
# Single-sourced from silkcode/__init__.py, so the number cannot drift between
# what the package reports and what the wheel is called.
dynamic = ["version"]
description = "Silk Code - an open, model-agnostic AI coding harness (agent runtime + CLI + GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://silkcode.web.app"
Repository = "https://github.com/RupertCloud/SilkCode"
Issues = "https://github.com/RupertCloud/SilkCode/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
silkcode = "silkcode.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "silkcode.__version__" }

[tool.setuptools.packages.find]
include = ["silkcode*"]

[tool.setuptools.package-data]
silkcode = ["gui/app.html"]
