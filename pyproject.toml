[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silkcode"
version = "0.1.0"
description = "Silk Code - an open, model-agnostic AI coding harness (agent runtime + CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
silkcode = "silkcode.cli.main:main"

[tool.setuptools.packages.find]
include = ["silkcode*"]

[tool.setuptools.package-data]
silkcode = ["gui/app.html"]
