name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - name: Version without the leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Create GitHub release with wheel and sdist
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install without building from source:

            ```bash
            pip install https://github.com/RupertCloud/SilkCode/releases/download/${{ github.ref_name }}/silkcode-${{ env.VERSION }}-py3-none-any.whl
            ```

            Or with [pipx](https://pipx.pypa.io) for an isolated install:

            ```bash
            pipx install https://github.com/RupertCloud/SilkCode/releases/download/${{ github.ref_name }}/silkcode-${{ env.VERSION }}-py3-none-any.whl
            ```

            Homepage: https://silkcode.web.app
