name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from tags, and the release gate
          # compares against the previous one; neither works on the default
          # shallow, tagless checkout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - name: Resolve tag and version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # A version that never moves is not cosmetic here: `pip install -U` reads
      # it to decide whether there is anything to do, so shipping two different
      # releases under one number makes every upgrade a silent no-op. Each
      # release must be numbered above the last.
      - name: Refuse a release that does not move the version
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$PREVIOUS" ]; then
            echo "No previous release; $TAG is the first."
            exit 0
          fi
          echo "Previous release: $PREVIOUS   this one: $TAG"
          HIGHEST="$(printf '%s\n%s\n' "${PREVIOUS#v}" "$VERSION" | sort -V | tail -n1)"
          if [ "$PREVIOUS" = "$TAG" ] || [ "$HIGHEST" != "$VERSION" ]; then
            echo "::error::$TAG does not come after $PREVIOUS."
            echo "::error::Bump the version by tagging above $PREVIOUS."
            exit 1
          fi
      # The version comes from git tags now, and on a workflow_dispatch the tag
      # does not exist yet - the release step creates it after this. Without
      # this the build would derive a dev version and produce a wheel whose name
      # does not match the release notes' download link.
      - name: Build at the version being released
        run: |
          set -euo pipefail
          git tag --force "$TAG"
          python -m build
          git tag --delete "$TAG"   # the release step creates the real one
      # pytest above runs against the source tree, which is not what anyone
      # installs. A wheel that is missing gui/app.html passes every test in
      # this repository and then fails on the user's first `silkcode gui`.
      #
      # The filename check is the same class of bug one step earlier: the
      # release notes below link .../$TAG/silkcode-$VERSION-py3-none-any.whl,
      # so the built wheel has to actually be named that. It is derived from
      # the tag, so a mismatch means the build did not see the tag - a shallow
      # checkout, most likely - and the release would publish with a download
      # link that 404s on its own page.
      - name: Smoke-test the wheel we are about to publish
        run: |
          set -euo pipefail
          WHEEL="dist/silkcode-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL" || {
            echo "::error::Tag $TAG expects $WHEEL, but the build produced:"
            ls -1 dist/
            echo "::error::The version comes from git tags; check the tag and the checkout depth."
            exit 1
          }
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install --quiet "$WHEEL"
          cd /tmp   # outside the checkout, so nothing resolves via the source tree
          /tmp/relcheck/bin/silkcode --version
          /tmp/relcheck/bin/python - <<'PY'
          import pathlib, silkcode, silkcode.cli, silkcode.gui.server, silkcode.scaffold
          page = pathlib.Path(silkcode.__file__).parent / "gui" / "app.html"
          assert page.is_file() and page.stat().st_size > 10_000, \
              f"the GUI page did not make it into the wheel: {page}"
          print("wheel smoke test passed:", silkcode.__file__)
          PY
      - name: Create GitHub release with wheel and sdist
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # tag the commit we actually built and tested; without this a
          # manually dispatched release tags the default branch instead
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            Install without building from source:

            ```bash
            pip install https://github.com/RupertCloud/SilkCode/releases/download/${{ env.TAG }}/silkcode-${{ env.VERSION }}-py3-none-any.whl
            ```

            Or with [pipx](https://pipx.pypa.io) for an isolated install:

            ```bash
            pipx install https://github.com/RupertCloud/SilkCode/releases/download/${{ env.TAG }}/silkcode-${{ env.VERSION }}-py3-none-any.whl
            ```

            macOS, without a terminal: download `SilkCode-${{ env.VERSION }}-arm64.dmg`
            (Apple Silicon) or `SilkCode-${{ env.VERSION }}-x86_64.dmg` (Intel) below, drag
            Silk Code into Applications, and open it (right-click → Open the first time:
            the app is not signed with an Apple developer certificate).

            Homepage: https://silkcode.web.app

  # The macOS app, one .dmg per architecture, attached to the release the
  # job above created. Built at the release version the same way: the tag
  # has to be visible to setuptools_scm when the wheel is built.
  macos:
    needs: release
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Resolve tag and version
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build the .dmg at the version being released
        run: |
          set -euo pipefail
          git tag --force "$TAG"
          packaging/macos/build-dmg.sh --arch "${{ matrix.arch }}"
          test -f "dist/SilkCode-${VERSION}-${{ matrix.arch }}.dmg" || {
            echo "::error::expected dist/SilkCode-${VERSION}-${{ matrix.arch }}.dmg, got:"
            ls -1 dist/
            exit 1
          }
      - name: Attach the .dmg to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.dmg
